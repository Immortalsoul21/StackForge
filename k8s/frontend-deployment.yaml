apiVersion: apps/v1
kind: Deployment
metadata:
    name: frontend
    namespace: stackforge
    labels:
        app: frontend
        tier: frontend
spec:
    replicas: 2
    selector:
        matchLabels:
            app: frontend
            tier: frontend
    template:
        metadata:
            labels:
                app: frontend
                tier: frontend
        spec:
            containers:
                - name: frontend
                  image: frontendkubernetesversion:v2 
                  imagePullPolicy: Never
                  ports:
                    - containerPort: 80
                      name: http

                  env:
                    - name: VITE_API_URL
                      valueFrom:
                        secretKeyRef:
                          name: stackforge-secret
                          key: VITE_API_URL
                  
                  resources:
                    requests:
                      memory: "64Mi"
                      cpu: "50m"
                    limits:
                      memory: "128Mi"
                      cpu: "100m"
      
